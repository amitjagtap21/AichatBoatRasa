version: "3.1"

intents:
  - greet
  - goodbye
  - insurance_eligibility_check
  - provide_name
  - provide_dob
  - provide_income
  - provide_insurance_type

entities:
  - name
  - dob
  - income
  - insurance_type

slots:
  name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: name
      - type: from_text
        conditions:
          - active_loop: insurance_form
            requested_slot: name

  dob:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: dob
      - type: from_text
        conditions:
          - active_loop: insurance_form
            requested_slot: dob

  income:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: income
      - type: from_text
        conditions:
          - active_loop: insurance_form
            requested_slot: income

  insurance_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: insurance_type
      - type: from_text
        conditions:
          - active_loop: insurance_form
            requested_slot: insurance_type

  response_key:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text

forms:
  insurance_form:
    required_slots:
      - name
      - dob
      - income
      - insurance_type
    ignored_intents:
      - goodbye

responses:
  utter_greet:
    - text: "Hi I'm Freeman Filling! Need help with SNAP or Medicaid? Select option to proceed"
      custom:
        flag: "intro_message"
        identity: "freeman_filling_bot"
  

  utter_goodbye:
    - text: "Goodbye! Have a nice day."
      custom:
        flag: "goodbye_message"
        identity: "goodbye_message"

  utter_ask_name:
    - text: "Please tell me your full name."
      custom:
        flag: "full_name"
        identity: "full_name"

  utter_ask_dob:
    - text: "What's your date of birth? (YYYY-MM-DD)"
      custom:
        flag: "date_of_birth"
        identity: "date_of_birth"

  utter_ask_income:
    - text: "What is your monthly income?"
      custom:
        flag: "monthly_income"
        identity: "monthly_income"

  utter_ask_insurance_type:
    - text: "What type of insurance do you want to check? (health/life/motor)"
      custom:
        flag: "which_insurance"
        identity: "which_insurance"

actions:
  - action_check_insurance_eligibility_api
  - action_reset_slots
  - action_reset_all_slots
  - action_unified_greet

session_config:
  session_expiration_time: 0  # 0 ka matlab har nayi conversation me reset hoga
  carry_over_slots_to_new_session: false