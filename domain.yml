version: "3.1"

intents:
  - greet
  - goodbye
  - choose_application
  - agree_terms
  - disagree_terms
  - benefits_self
  - benefits_other
  - provide_state
  - medicaid_application
  - snap_application
  - both_applications
  - living_situation
  - household_special_situations
  - file_uploaded

entities:
  - state
  - household
  - filename
  - content

slots:
  id_proof:
    type: text
    influence_conversation: false
    initial_value: null
    mappings:
      - type: from_text

  filename:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: filename

  content:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: content

  state:
    type: text
    mappings:
      - type: from_entity
        entity: state

  household:
    type: text
    mappings:
      - type: from_entity
        entity: household

  response_key:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_dob:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_id_number:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_address:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_issue_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_expiry_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_gender:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  extracted_height:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

responses:
  utter_ask_state:
    - text: "Please select the state you are applying for:"
      buttons:
        - title: "Florida"
          payload: "/provide_state{\"state\":\"Florida\"}"
        - title: "California"
          payload: "/provide_state{\"state\":\"California\"}"
        - title: "Texas"
          payload: "/provide_state{\"state\":\"Texas\"}"
        - title: "Alaska"
          payload: "/provide_state{\"state\":\"Alaska\"}"
        - title: "Indiana"
          payload: "/provide_state{\"state\":\"Indiana\"}"
        - title: "Maryland"
          payload: "/provide_state{\"state\":\"Maryland\"}"
        - title: "New York"
          payload: "/provide_state{\"state\":\"New York\"}"
        - title: "Other"
          payload: "/provide_state{\"state\":\"Other\"}"

  utter_greet:
    - text: "Hi I'm Freeman Filling! Need help with SNAP or Medicaid?"
      buttons:
        - title: "Medicaid Application"
          payload: "/medicaid_application"
        - title: "SNAP Application"
          payload: "/snap_application"
        - title: "Both Medicaid Application & SNAP"
          payload: "/both_applications"

  utter_goodbye:
    - text: "Goodbye! Have a nice day."

  utter_enrollment:
    - text: "Are you enrolled with us?"

  utter_terms:
    - text: "Please agree with terms & conditions to proceed."
      buttons:
        - title: "Agree"
          payload: "/agree_terms"
        - title: "Disagree"
          payload: "/disagree_terms"

  utter_agree:
    - text: "Are you applying benefits for yourself?"
      buttons:
        - title: "Self"
          payload: "/benefits_self"
        - title: "Other"
          payload: "/benefits_other"

      
  
  utter_benefit_other:
    - text: "You are applying benefits for someone else."

  utter_disagree:
    - text: "You must agree to proceed."

  utter_confirm_state:
    - text: "You selected {state}. Let’s continue your application."
  
  utter_confirm_household:
    - text: "You selected {household}. Let’s continue your application."

  utter_request_id_proof:
    - text: "Please upload a valid ID proof (e.g., Driver’s License, Passport)."
      custom:
        data:
          type: "file_upload"

  utter_living_situation:
    - text: "Please select your living situation."
      buttons:
        - title: "Own Home"
          payload: "/living_situation{\"situation\":\"Own Home\"}"
        - title: "Rent Home"
          payload: "/living_situation{\"situation\":\"Rent Home\"}"
        - title: "Shelter"
          payload: "/living_situation{\"situation\":\"shelter\"}"
        - title: "Staying with friend"
          payload: "/living_situation{\"situation\":\"Staying with friend\"}"
        - title: "Homeless"
          payload: "/living_situation{\"situation\":\"Homeless\"}"

  utter_household:
    - text: "Please select your household special situations"
      buttons:
        - title: "Tax filer"
          payload: "/household_special_situations{\"household\":\"Tax filer\"}"
        - title: "Public Assistance"
          payload: "/household_special_situations{\"household\":\"Public Assistance\"}"
        - title: "Military service"
          payload: "/household_special_situations{\"household\":\"Military service\"}"

  utter_file_received:
    - text: "✅ test I extracted the following details:\n- Name: {extracted_name}\n- DOB: {extracted_dob}\n- ID Number: {extracted_id_number}"

  utter_file_processed:
    - text: "✅ Extracted Details"
      custom:
        data:
          type: "details_card"
          title: "✅ Extracted Details"
          fields:
            - label: "Name"
              value: "{extracted_name}"
            - label: "DOB"
              value: "{extracted_dob}"
            - label: "ID Number"
              value: "{extracted_id_number}"
            - label: "Address"
              value: "{extracted_address}"
            - label: "Issue Date"
              value: "{extracted_issue_date}"
            - label: "Expiry Date"
              value: "{extracted_expiry_date}"
            - label: "Gender"
              value: "{extracted_gender}"
            - label: "Height"
              value: "{extracted_height}"

actions:
  - action_unified_greet
  - action_ask_state
  - action_handle_file
  - action_extract_file_data
