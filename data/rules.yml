version: "3.1"

rules:
- rule: Say goodbye anytime user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Greet the user
  steps:
    - intent: greet
    - action: utter_greet

- rule: Ask for ID proof only if not uploaded
  condition:
     - slot_was_set:
        - id_proof: null
  steps:
    - action: utter_request_id_proof

