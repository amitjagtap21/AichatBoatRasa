version: "3.1"

nlu:

## Greet Intent
- intent: greet
  examples: |
    - hi
    - hello
    - hey
    - good morning
    - good evening
    - hi there
    - hey bot
    - hello there

## Goodbye Intent
- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you
    - talk to you later
    - see ya
    - have a nice day

## Insurance Eligibility Check Intent
- intent: insurance_eligibility_check
  examples: |
    - I want to check insurance eligibility
    - Can you check if I am eligible for health insurance?
    - Check if I can get health insurance
    - Am I eligible for life insurance?
    - Please check my eligibility for insurance
    - I want to see if I qualify for motor insurance
    - Can you check my insurance eligibility?

## Provide Name
- intent: provide_name
  examples: |
    - My name is Amit Jagtap
    - Amit Jagtap
    - I am Rahul
    - Rahul Sharma
    - The name is Priya
    - Priya Verma
    - It's Suresh Kumar

## Provide DOB
- intent: provide_dob
  examples: |
    - 1990-01-01
    - 05-08-1992
    - My date of birth is 1985-06-15
    - I was born on 1999-12-30
    - 15th August 1990
    - DOB is 1975-03-21

## Provide Income
- intent: provide_income
  examples: |
    - 25000
    - 50000
    - My monthly income is 30000
    - I earn 40000 per month
    - Around 45000
    - About 20000

## Provide Insurance Type
- intent: provide_insurance_type
  examples: |
    - health
    - life
    - motor
    - I am looking for health insurance
    - I want life insurance
    - motor insurance
    - health plan
